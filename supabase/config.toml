# supabase/config.toml
# Konfigurasi Supabase CLI untuk project ini

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false         # Signup hanya via invite (create-petugas function)
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
